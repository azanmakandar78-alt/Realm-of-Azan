<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realm of Azan V5</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game">

    <header>
        <h1>🏰 Realm of Azan V5</h1>

        <div id="stats">

            <div>❤️ <span id="hp">100</span></div>

            <div>⭐ <span id="level">1</span></div>

            <div>✨ <span id="xp">0</span></div>

            <div>🪙 <span id="gold">50</span></div>

        </div>

    </header>

    <main>

        <div id="map"></div>

        <div id="controls">

            <button id="up">⬆️</button>

            <div class="middle">

                <button id="left">⬅️</button>

                <button id="action">⚔️</button>

                <button id="right">➡️</button>

            </div>

            <button id="down">⬇️</button>

        </div>

    </main>

    <div id="log">
        Welcome to Realm of Azan!
    </div>

</div>

<script src="game.js"></script>

</body>
</html>
