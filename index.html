<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realm of Azan V4</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

<header>

<h1>🏰 Realm of Azan V4</h1>

<div id="stats">

<span>❤️ <span id="hp">100</span>/100</span>

<span>⭐ Lv <span id="level">1</span></span>

<span>✨ XP <span id="xp">0</span>/100</span>

<span>🪙 <span id="gold">50</span></span>

</div>

</header>

<div id="map"></div>

<div id="controls">

<button id="up">⬆️</button>

<div>

<button id="left">⬅️</button>

<button id="rest">😴</button>

<button id="right">➡️</button>

</div>

<button id="down">⬇️</button>

</div>

<div id="log">

🎂 Welcome to Realm of Azan!

</div>

</div>

<script src="game.js"></script>

</body>
</html>
